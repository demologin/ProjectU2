- id: ship
  name: Spaceship
  description: Отправьтесь в приключение на космическом корабле.
  text: |
    <h2>Пролог</h2>
    Ты стоишь в космическом порту и готов подняться на борт своего корабля. Разве ты не об этом мечтал?
    Стать капитаном галактического судна с экипажем, который будет совершать подвиги под твоим командованием.
    Так что вперед!<br>
    <h2>Знакомство с экипажем</h2>
    Когда ты поднялся на борт корабля, тебя поприветствовала девушка с черной палкой в руках:
    - Здравствуйте, командир! Я Зинаида - ваша помощница. Видите? Там в углу пьет кофе наш штурман -
    сержант Перегарный Шлейф, под штурвалом спит наш бортмеханик - Черный Богдан, а фотографирует
    его Сергей Стальная Пятка - наш навигатор.
    А как обращаться к вам?
  scenes:
    - id: ship-0
      text: Ты потерял память. Принять вызов НЛО?
      options:
        - id: ship-0-0
          text: Принять вызов.
          nextSceneId: ship-1
        - id: ship-0-1
          text: Отклонить вызов.
          nextSceneId: ship-2
    - id: ship-1
      text: Ты принял вызов. Поднимешься на мостик к капитану?
      options:
        - id: ship-1-0
          text: Подняться на мостик.
          nextSceneId: ship-3
        - id: ship-1-1
          text: Отказаться подниматься на мостик.
          nextSceneId: ship-4
    - id: ship-2
      text: Ты отклонил вызов. <b>Поражение.</b>
      systemActions:
        - RESTART
        - EXIT
    - id: ship-3
      text: Ты поднялся на мостик. Кто ты?
      options:
        - id: ship-3-0
          text: Рассказать правду о себе.
          nextSceneId: ship-5
        - id: ship-3-1
          text: Солгать о себе.
          nextSceneId: ship-6
    - id: ship-4
      text: Ты не пошел на переговоры. <b>Поражение.</b>
      systemActions:
        - RESTART
        - EXIT
    - id: ship-5
      text: Тебя вернули домой. <b>Победа!</b>
      systemActions:
        - RESTART
        - EXIT
    - id: "ship-6"
      text: Твою ложь разоблачили. <b>Поражение.</b>
      systemActions:
        - RESTART
        - EXIT
